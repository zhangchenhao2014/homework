# ============================================================
#  Cloudflare Pages 配置（当前使用的方式）
#
#  为什么不用 Workers：workers.dev 这个域名在国内被 TLS/SNI 层阻断
#  （换任何 IP 都在握手阶段被重置），而 pages.dev 可以正常访问。
#  另外 Pages 能把静态页和 API 放在同一个域名下，前端连服务地址都不用手填。
#
#  常用命令：
#    npx wrangler pages dev            # 本地开发（内置 D1）
#    npx wrangler pages deploy         # 部署，输出 https://<项目名>.pages.dev
#    npx wrangler pages deployment list
#
#  注意：Pages 不支持 --config，所以配置必须放在项目根的 wrangler.toml。
# ============================================================

name = "homework"
pages_build_output_dir = "assets"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "homework-sync"
database_id = "b727ebc2-40b2-4540-8b4f-201757f1a910"

[vars]
# 页面与 API 同源后不再需要 CORS；保留 GitHub 来源是为了
# 旧的 github.io 页面也能调用（可选，不影响使用）。
ALLOWED_ORIGINS = "https://zhangchenhao2014.github.io,http://127.0.0.1:8788,http://localhost:8788,http://127.0.0.1:8790,http://localhost:8790"
